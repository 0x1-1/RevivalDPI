version: 2

updates:
  # NuGet paketleri
  - package-ecosystem: nuget
    directory: "/src/RevivalDPI"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - bağımlılık
    # MaterialDesign ana surum atlamalari (4.x -> 5.x) XAML'de kirilma
    # yaratabilir: eski pencere BundledTheme ve MaterialDesignOutlinedButton
    # kullaniyor ve bunlar acilista ayristiriliyor, yani bir uyumsuzluk
    # derlemede degil calisma aninda patlar. Ana surum atlamalari elle
    # denenip dogrulanmali.
    ignore:
      - dependency-name: "MaterialDesign*"
        update-types: ["version-update:semver-major"]
    groups:
      material-design:
        patterns:
          - "MaterialDesign*"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - bağımlılık
      - ci
